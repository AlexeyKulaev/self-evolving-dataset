name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[demo]'
      - run: python -m unittest discover -s tests -v
      - run: evolving-dataset --config examples/arithmetic/config.toml run --max-stages 10
      - run: evolving-dataset --config examples/arithmetic/config.toml baseline
  huggingface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[hf,demo]'
      - run: python -m unittest discover -s tests -v
